name: Mika test APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Place French strings.xml
        run: mkdir -p app/src/main/res/values-fr && mv app/src/main/res/strings.xml app/src/main/res/values-fr/strings.xml
      - name: Enforce French only
        run: python3 tools/french_only.py
      - name: Test and build side-by-side debug APK
        run: ./gradlew :app:assembleDebug -PdevInstall --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mika-v0.1.38-Plugins-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
